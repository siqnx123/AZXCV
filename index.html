<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SOST AI — بوابة المحادثة</title>
<meta content="#050505" name="theme-color"/>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0507'/%3E%3Cg fill='none' stroke='%23ff2233' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20.5 6.6c0 3.4-9 3-9 7.4s8.2 3.6 8.2 7.4c0 2-1.7 3.4-4.2 3.4'/%3E%3Ccircle cx='20.5' cy='6.6' r='2.4' fill='%23ff2233' stroke='none'/%3E%3C/g%3E%3C/svg%3E" rel="icon" type="image/svg+xml"/>
<script src="config.js"></script>
<script src="prompt.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #050505; --surface: rgba(20,8,10,.72); --border: rgba(255,34,51,.18); --border-strong: rgba(255,34,51,.45);
  --text-primary: #fff5f5; --text-secondary: #c9a9ac; --text-muted: #8a6266; --accent: #ff2233; --accent-deep: #a80016;
  --accent-soft: rgba(255,34,51,.10); --user-bubble-bg: linear-gradient(135deg, #ff2233 0%, #8b0018 100%);
  --font: 'Noto Sans Arabic', sans-serif; --radius: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; width: 100%; background: var(--bg); color: var(--text-primary); font-family: var(--font); font-size: 14px; }
button { font-family: var(--font); cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #3d1419; border-radius: 4px; }

/* AUTH */
.auth-overlay { position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at 50% 0%, rgba(255,34,51,.2), transparent 70%), #050505; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-overlay.hidden { display: none; }
.auth-card { width: 100%; max-width: 400px; padding: 30px; background: rgba(10,3,5,.9); border: 1px solid rgba(255,34,51,.35); border-radius: 20px; box-shadow: 0 0 60px rgba(255,34,51,.2); }
.auth-logo-title { font-size: 40px; font-weight: 900; background: linear-gradient(135deg, #ff2233, #8b0018); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 20px; }
.auth-tabs { display: flex; gap: 5px; background: rgba(255,34,51,.05); border: 1px solid rgba(255,34,51,.2); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text-muted); }
.auth-tab.active { background: linear-gradient(135deg, #ff2233, #8b0018); color: #fff; }
.auth-field { margin-bottom: 15px; }
.auth-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
.auth-field input { width: 100%; padding: 12px; background: rgba(255,34,51,.05); border: 1px solid rgba(255,34,51,.2); border-radius: 10px; color: #fff; outline: none; }
.auth-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff2233, #8b0018); border-radius: 10px; color: #fff; font-weight: 700; margin-top: 10px; }
.auth-msg { text-align: center; font-size: 12px; margin-top: 15px; color: #ff7b88; min-height: 20px; }
.auth-msg.success { color: #5ad19a; }

/* APP */
.app { display: flex; flex-direction: row; height: 100dvh; overflow: hidden; }
.sidebar { width: 280px; background: #080304; display: flex; flex-direction: column; border-left: 1px solid rgba(255,34,51,.1); transition: transform 0.3s ease; z-index: 100; }
.new-chat-btn { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 15px; padding: 12px; background: rgba(255,34,51,.15); border: 1px solid rgba(255,34,51,.4); border-radius: 10px; color: #fff; font-weight: 700; }
.sidebar-chats { flex: 1; overflow-y: auto; padding: 10px; }
.history-item { display: block; width: 100%; text-align: right; padding: 10px; font-size: 13px; color: var(--text-secondary); border-radius: 8px; margin-bottom: 5px; }
.history-item:hover, .history-item.active { color: var(--accent); background: rgba(255,34,51,.1); }
.sidebar-bottom { padding: 15px; border-top: 1px solid rgba(255,34,51,.1); }
.settings-trigger { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; font-size: 13px; color: var(--text-muted); border-radius: 8px; }
.settings-trigger:hover { background: var(--accent-soft); color: var(--accent); }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 99; }

/* CHAT */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top-bar { height: 60px; background: rgba(6,2,3,.8); border-bottom: 1px solid rgba(255,34,51,.1); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
.mobile-burger { display: none; padding: 5px; color: var(--text-secondary); }
.user-badge { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(255,34,51,.1); border: 1px solid rgba(255,34,51,.3); border-radius: 20px; font-size: 12px; }
.ub-plan { background: #ff2233; color: #fff; padding: 2px 6px; border-radius: 10px; font-size: 10px; }
.three-dot-btn { font-size: 24px; color: var(--text-secondary); padding: 0 10px; }
.three-dot-menu { position: absolute; top: 60px; left: 15px; background: #0a0305; border: 1px solid rgba(255,34,51,.3); border-radius: 12px; padding: 8px; display: none; flex-direction: column; gap: 5px; z-index: 200; min-width: 180px; }
.three-dot-menu.open { display: flex; }
.dd-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; color: var(--text-primary); border-radius: 8px; text-align: right; width: 100%; }
.dd-item:hover { background: rgba(255,34,51,.1); color: var(--accent); }
.dd-item.danger { color: #ff7b88; }

/* MESSAGES */
.messages-wrap { flex: 1; overflow-y: auto; padding: 20px 15px; }
.messages-col { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.msg { display: flex; gap: 10px; }
.msg-user { justify-content: flex-end; }
.msg-user .msg-bubble { background: var(--user-bubble-bg); padding: 12px 16px; border-radius: 16px 16px 2px 16px; max-width: 85%; color: #fff; line-height: 1.5; }
.msg-user .msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: #ff2233; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: bold; order: 1; }
.msg-assistant { align-items: flex-start; }
.msg-assistant .msg-content { background: rgba(255,34,51,.05); border: 1px solid rgba(255,34,51,.1); padding: 12px 16px; border-radius: 16px 16px 16px 2px; max-width: 85%; color: #fff; line-height: 1.6; }

/* INPUT */
.input-area { padding: 15px; background: rgba(5,2,3,.9); }
.input-box { display: flex; align-items: flex-end; gap: 10px; background: rgba(14,4,7,.95); border: 1px solid rgba(255,34,51,.3); border-radius: 20px; padding: 8px; max-width: 900px; margin: 0 auto; }
.input-box textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; resize: none; font-size: 16px; min-height: 40px; max-height: 120px; padding: 8px; }
.attach-btn, .mic-btn, .send-btn { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.attach-btn, .mic-btn { color: var(--text-muted); background: transparent; border: 1px solid rgba(255,34,51,.2); }
.send-btn { background: #ff2233; color: #fff; }
.plus-menu { position: absolute; bottom: 80px; left: 20px; background: #0a0305; border: 1px solid rgba(255,34,51,.3); border-radius: 12px; padding: 8px; display: none; flex-direction: column; gap: 5px; z-index: 60; }
.plus-menu.open { display: flex; }
.plus-item { display: flex; align-items: center; gap: 10px; padding: 10px; font-size: 13px; border-radius: 8px; text-align: right; }
.plus-item:hover { background: rgba(255,34,51,.1); }

/* MODALS */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
.modal-overlay.open { display: flex; }
.modal { background: #0a0305; border: 1px solid rgba(255,34,51,.3); border-radius: 16px; width: 100%; max-width: 450px; }
.modal-head { padding: 15px; border-bottom: 1px solid rgba(255,34,51,.1); display: flex; justify-content: space-between; }
.modal-body { padding: 15px; }

/* MOBILE */
@media (max-width: 768px) {
  .sidebar { position: fixed; top: 0; bottom: 0; right: 0; transform: translateX(100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .mobile-burger { display: block; }
  .msg-user .msg-bubble, .msg-assistant .msg-content { max-width: 95%; }
}
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo-title">SOST</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin" type="button">دخول</button>
      <button class="auth-tab" id="authTabRegister" type="button">تسجيل جديد</button>
    </div>
    <form id="authForm" onsubmit="return false;">
      <div class="auth-field">
        <label>اسم المستخدم</label>
        <input type="text" id="authUser" required/>
      </div>
      <div class="auth-field">
        <label>كلمة المرور</label>
        <input type="password" id="authPass" required/>
      </div>
      <button class="auth-submit" id="authSubmit" type="submit">دخول النظام</button>
      <div class="auth-msg" id="authMsg"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ محادثة جديدة</button>
    <div class="sidebar-chats" id="history"></div>
    <div class="sidebar-bottom">
      <button class="settings-trigger" id="settingsTrigger">الإعدادات</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="chat-area">
    <div class="top-bar">
      <button class="mobile-burger" id="mobileBurger">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
      </button>
      <div class="user-badge" id="userBadge">
        <span id="ubName">زائر</span>
        <span class="ub-plan" id="ubPlan">FREE</span>
      </div>
      <button class="three-dot-btn" id="threeDotBtn">⋮</button>
      <div class="three-dot-menu" id="threeDotMenu">
        <button class="dd-item" id="ddNewChat">محادثة جديدة</button>
        <button class="dd-item" id="ddSubscriptions">الاشتراكات</button>
        <button class="dd-item" id="ddSupport">الدعم الفني</button>
        <button class="dd-item danger" id="ddLogout">تسجيل الخروج</button>
      </div>
    </div>

    <div class="messages-wrap" id="messagesWrap">
      <div class="messages-col" id="messagesCol">
        <div style="text-align:center;padding:40px;color:#666;" id="welcomeMsg">مرحباً بك! ابدأ المحادثة.</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box" style="position:relative;">
        <button class="attach-btn" id="attachBtn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
        </button>
        <div class="plus-menu" id="plusMenu">
          <button class="plus-item" id="plusFilesBtn">الملفات</button>
        </div>
        <textarea id="mainInput" placeholder="رسالتك..." rows="1"></textarea>
        <button class="send-btn" id="mainSendBtn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="19" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- MODALS (Settings, Subs, Support, Admin) -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-head"><h3>الإعدادات</h3><button id="settingsClose">✕</button></div>
    <div class="modal-body">
      <button class="btn-primary" id="devAccessBtn" style="width:100%;margin-bottom:10px;">دخول المطور</button>
      <button class="btn-danger" id="clearAllChatsBtn" style="width:100%;">مسح المحادثات</button>
    </div>
  </div>
</div>

<script>
(function() {
    'use strict';
    let currentUser = null;
    let chats = [];
    let currentId = null;
    let isProcessing = false;

    const $ = id => document.getElementById(id);

    async function apiCall(endpoint, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include' };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(endpoint, options);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'خطأ');
        return data;
    }

    async function checkAuth() {
        try {
            const res = await apiCall('/api/auth/me');
            if (res.ok && res.user) {
                currentUser = res.user;
                enterApp();
                return;
            }
        } catch (e) {}
        $('authOverlay').classList.remove('hidden');
    }

    function enterApp() {
        $('authOverlay').classList.add('hidden');
        $('ubName').textContent = currentUser.username;
        $('ubPlan').textContent = (currentUser.role === 'admin' ? 'ADMIN' : 'FREE');
        loadChats();
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Auth
        $('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const isReg = $('authTabRegister').classList.contains('active');
            const btn = $('authSubmit');
            btn.disabled = true; btn.textContent = '...';
            try {
                const endpoint = isReg ? '/api/auth/register' : '/api/auth/login';
                const res = await apiCall(endpoint, 'POST', { username: $('authUser').value.trim(), password: $('authPass').value });
                if (res.ok) {
                    $('authMsg').textContent = 'تم بنجاح!';
                    $('authMsg').style.color = '#5ad19a';
                    setTimeout(checkAuth, 500);
                }
            } catch (err) {
                $('authMsg').textContent = err.message;
                $('authMsg').style.color = '#ff7b88';
            } finally { btn.disabled = false; btn.textContent = isReg ? 'إنشاء' : 'دخول'; }
        };
        
        $('authTabLogin').onclick = () => { $('authTabLogin').classList.add('active'); $('authTabRegister').classList.remove('active'); $('authSubmit').textContent = 'دخول'; };
        $('authTabRegister').onclick = () => { $('authTabRegister').classList.add('active'); $('authTabLogin').classList.remove('active'); $('authSubmit').textContent = 'إنشاء'; };

        // UI
        $('threeDotBtn').onclick = (e) => { e.stopPropagation(); $('threeDotMenu').classList.toggle('open'); };
        document.addEventListener('click', () => $('threeDotMenu').classList.remove('open'));
        $('ddLogout').onclick = async () => { await apiCall('/api/auth/logout', 'POST'); location.reload(); };
        $('ddNewChat').onclick = newChat;
        $('settingsTrigger').onclick = () => $('settingsOverlay').classList.add('open');
        $('settingsClose').onclick = () => $('settingsOverlay').classList.remove('open');
        
        // Send
        $('mainSendBtn').onclick = sendMessage;
        $('mainInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        checkAuth();
    });

    async function loadChats() {
        try {
            const res = await apiCall('/api/chats');
            if (res.ok) {
                chats = res.chats;
                renderHistory();
                if (chats.length > 0) loadChat(chats[0].id);
            }
        } catch (e) {}
    }

    function renderHistory() {
        const h = $('history');
        h.innerHTML = chats.map(c => `<button class="history-item ${c.id === currentId ? 'active' : ''}" onclick="window._loadChat('${c.id}')">${c.title || 'محادثة'}</button>`).join('');
    }
    window._loadChat = loadChat;

    async function loadChat(id) {
        currentId = id;
        $('messagesCol').innerHTML = '';
        renderHistory();
        try {
            const res = await apiCall(`/api/chats/${id}/messages`);
            if (res.ok) res.messages.forEach(m => addMessageUI(m.role, m.content));
            scrollBottom();
        } catch (e) {}
    }

    function newChat() {
        currentId = Date.now().toString();
        $('messagesCol').innerHTML = '<div style="text-align:center;padding:40px;color:#666;">مرحباً بك! ابدأ المحادثة.</div>';
        renderHistory();
    }

    async function sendMessage() {
        if (isProcessing) return;
        const input = $('mainInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        $('messagesCol').innerHTML = '';
        addMessageUI('user', text);
        $('mainSendBtn').style.display = 'none';
        isProcessing = true;

        const loadingId = 'load-' + Date.now();
        const el = document.createElement('div');
        el.id = loadingId;
        el.className = 'msg msg-assistant';
        el.innerHTML = '<div class="msg-content" style="color:#888;">يفكر...</div>';
        $('messagesCol').appendChild(el);
        scrollBottom();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ conversationId: currentId, message: text })
            });
            const data = await res.json();
            document.getElementById(loadingId).remove();
            if (!res.ok) throw new Error(data.error);
            addMessageUI('assistant', data.reply);
            loadChats();
        } catch (err) {
            document.getElementById(loadingId).remove();
            addMessageUI('assistant', '⚠️ ' + err.message);
        } finally {
            isProcessing = false;
            $('mainSendBtn').style.display = 'flex';
        }
    }

    function addMessageUI(role, text) {
        const el = document.createElement('div');
        el.className = `msg msg-${role}`;
        if (role === 'user') {
            el.innerHTML = `<div class="msg-bubble">${escapeHTML(text)}</div><div class="msg-avatar">U</div>`;
        } else {
            el.innerHTML = `<div class="msg-content">${formatMsg(text)}</div>`;
        }
        $('messagesCol').appendChild(el);
        scrollBottom();
    }

    function escapeHTML(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function formatMsg(t) { return escapeHTML(t).replace(/\n/g, '<br>'); }
    function scrollBottom() { const w = $('messagesWrap'); w.scrollTop = w.scrollHeight; }
})();
</script>
</body>
</html>
